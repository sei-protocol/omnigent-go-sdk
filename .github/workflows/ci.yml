name: CI

# The whole repository is this one Go module, so these checks CAN be the gate
# rather than an advisory layer beside one. The monorepo this came from could not
# offer that: its required-checks list was generated elsewhere, so a new
# workflow's name could not be added from a pull request and nothing substantive
# ever ran on the SDK there.
#
# Being the gate still takes one step outside this file. Every check name has to
# be in the branch's required-status-checks list, and a job that runs without
# being required is advisory no matter what it asserts. The matrix renders one
# name per leg, so the full set is:
#
#   Go SDK tests (1.25.x), Go SDK tests (stable), Go SDK lint
#
# Require those three and nothing else. Two names from the release workflows show
# up in the same picker and must never be added:
#
#   Release / Check   fires only on a pull request that changes version.json
#   Release / Publish fires only on a push to the default branch
#
# A required check that does not report leaves every pull request waiting for a
# status that never arrives, and rulesets have no skip-if-not-run. Note also that
# a matrix leg's name is the gate, so retiring a Go version orphans a required
# name and blocks merges until the list is edited.
#
# bin/check.sh is the same script a developer runs locally. It is invoked here
# rather than reimplemented so the two cannot drift.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # A pull request supersedes its own earlier runs, so cancelling is what a
  # reviewer wants. A push to the default branch does not: keying those on the
  # ref lets one merge cancel the previous merge's CI, and the release workflow
  # does not wait for CI either. That combination already published a tag on a
  # commit whose tests were cancelled, so push runs key on the commit and never
  # cancel.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The module's declared floor and current stable. The floor leg is the
    # load-bearing one: go.mod claims 1.25 so a consumer may be there, and a claim
    # nothing builds is a claim nothing keeps. go vet's stdversion analyzer catches
    # a too-new stdlib symbol, but only this leg catches behaviour.
    #
    # The two collapse to one toolchain until 1.26 ships. Keeping both named means
    # the floor stays covered on the day they diverge, rather than needing a leg
    # added at the moment it starts to matter.
    name: Go SDK tests (${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25.x', 'stable']
    steps:
      - name: Check out repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.mod

      - name: Run the SDK's checks
        run: bin/check.sh

      # -count=2 defeats the test binary's result caching, which would otherwise
      # hide a test that only passes on a warm cache.
      - name: Re-run the tests without caching
        run: go test ./... -race -count=2

  lint:
    name: Go SDK lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # The floor rather than stable, and pinned on purpose. golangci-lint builds
      # IR for the standard library of whatever toolchain runs it, so a Go release
      # can break it with no change here: 1.27 rolled out to `stable` and v2.12.2
      # panicked on internal/poll with "unexpected expr: *ast.KeyValueExpr",
      # failing every branch at once. Both pins move together, deliberately —
      # raising the toolchain here means checking the linter survives it.
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.mod

      # Installed with `go install` rather than golangci-lint's own action so
      # this workflow pins nothing but the two actions lint.yml already pins.
      # The version is fixed because a linter release can add findings.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Run golangci-lint
        run: golangci-lint run

      # Folded into this job rather than added as its own, because a new job name
      # is advisory until someone edits the branch's required-checks list, and a
      # check that cannot block is not a gate. See the note at the top of this
      # file.
      #
      # This is the only check that catches a spec bump nobody regenerated for. A
      # new event variant fails TestEveryUnionVariantHasAGoType and a retyped
      # field fails the conformance suite, but a new field on an existing schema
      # is invisible to both: they read a Go type and ask the document about it,
      # so a field no Go type declares is a field nothing asks about.
      - name: Install oapi-codegen
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0

      - name: Check the generated package is current
        run: |
          bin/generate.sh
          if ! git diff --exit-code -- internal/api; then
            printf '\ninternal/api is not what the spec produces. Run bin/generate.sh and commit the result.\n' >&2
            exit 1
          fi
