name: CI

# The whole repository is this one Go module, so these checks CAN be the gate
# rather than an advisory layer beside one. The monorepo this came from could not
# offer that: its required-checks list was generated elsewhere, so a new
# workflow's name could not be added from a pull request and nothing substantive
# ever ran on the SDK there.
#
# Being the gate still takes one step outside this file. Every check name has to
# be in the branch's required-status-checks list, and a job that runs without
# being required is advisory no matter what it asserts. The matrix renders one
# name per leg, so the full set is:
#
#   Go SDK tests (1.24.x), Go SDK tests (stable),
#   Go SDK generated bindings, Go SDK lint
#
# bin/check.sh is the same script a developer runs locally. It is invoked here
# rather than reimplemented so the two cannot drift.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The module's declared floor and the current stable release. The floor is
    # what a consumer may be on, so it is the one that has to keep compiling.
    name: Go SDK tests (${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ['1.24.x', 'stable']
    steps:
      - name: Check out repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum

      - name: Run the SDK's checks
        run: bin/check.sh

      # -count=2 defeats the test binary's result caching, which would otherwise
      # hide a test that only passes on a warm cache.
      - name: Re-run the tests without caching
        run: go test ./... -race -count=2

  generated:
    # The generated bindings and the spec they come from are committed side by
    # side, so nothing about reading the repository reveals that one was refreshed
    # without the other. That is not hypothetical: the seeded models were a spec
    # older than the one vendored beside them, and the field the newer spec added
    # was missing from the struct for as long as nothing re-ran the generator.
    #
    # Its own job rather than a step in bin/check.sh, which is deliberately
    # limited to what the Go toolchain already provides; this needs python and
    # oapi-codegen. The generator is fail-closed on a missing tool, and it ignores
    # the local skip variable in CI, so this cannot pass by not running.
    name: Go SDK generated bindings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      # Pinned to the module's floor, not `stable`, because this job compares
      # generated bytes. oapi-codegen formats its output through go/printer, so
      # the toolchain is as much an input to those bytes as the generator is --
      # a release that reflows doc comments, as 1.19 did, would fail this check
      # on a repository nobody touched. Regeneration has to use this same line.
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.24.x'
          cache-dependency-path: go.sum

      # Pinned for the same reason, on the other input. A Go module version is
      # immutable through the checksum database, so a tag is reproducible here
      # in a way a floating action tag would not be.
      - name: Install oapi-codegen
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.6.0

      - name: Verify the bindings match the vendored spec
        run: python3 scripts/gen_go_client.py --check

  lint:
    name: Go SDK lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: go.sum

      # Installed with `go install` rather than golangci-lint's own action so
      # this workflow pins nothing but the two actions lint.yml already pins.
      # The version is fixed because a linter release can add findings.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Run golangci-lint
        run: golangci-lint run
