name: CI

# The whole repository is this one Go module, so these checks CAN be the gate
# rather than an advisory layer beside one. The monorepo this came from could not
# offer that: its required-checks list was generated elsewhere, so a new
# workflow's name could not be added from a pull request and nothing substantive
# ever ran on the SDK there.
#
# Being the gate still takes one step outside this file. Every check name has to
# be in the branch's required-status-checks list, and a job that runs without
# being required is advisory no matter what it asserts. The matrix renders one
# name per leg, so the full set is:
#
#   Go SDK tests (1.24.x), Go SDK tests (stable), Go SDK lint
#
# bin/check.sh is the same script a developer runs locally. It is invoked here
# rather than reimplemented so the two cannot drift.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # A pull request supersedes its own earlier runs, so cancelling is what a
  # reviewer wants. A push to the default branch does not: keying those on the
  # ref lets one merge cancel the previous merge's CI, and the release workflow
  # does not wait for CI either. That combination already published a tag on a
  # commit whose tests were cancelled, so push runs key on the commit and never
  # cancel.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The module's declared floor and the current stable release. The floor is
    # what a consumer may be on, so it is the one that has to keep compiling.
    name: Go SDK tests (${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ['1.24.x', 'stable']
    steps:
      - name: Check out repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.mod

      - name: Run the SDK's checks
        run: bin/check.sh

      # -count=2 defeats the test binary's result caching, which would otherwise
      # hide a test that only passes on a warm cache.
      - name: Re-run the tests without caching
        run: go test ./... -race -count=2

  lint:
    name: Go SDK lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: go.mod

      # Installed with `go install` rather than golangci-lint's own action so
      # this workflow pins nothing but the two actions lint.yml already pins.
      # The version is fixed because a linter release can add findings.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Run golangci-lint
        run: golangci-lint run
