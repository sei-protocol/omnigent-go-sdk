# Generator config for this module's models.gen.go. Regenerate through
# scripts/gen_go_client.py, which narrows and downgrades openapi.json into a
# temp dir first and passes `-o` — invoking oapi-codegen directly with this
# config writes to stdout and skips both steps, so it will not work.
package: omnigent
generate:
  # Models only. A generated client would name its methods after FastAPI's
  # path-mangled operationIds, return raw *http.Response, and have no SSE
  # support — the hand-written facade in this package replaces it.
  models: true
compatibility:
  # Prefix every enum constant with its type name, not just the ones that would
  # otherwise collide. Without it the package exports bare `URL`, `Form`, `User`
  # and `File` at package scope, which is a hazard for anything that dot-imports
  # the SDK and is not API this module means to offer.
  always-prefix-enum-values: true
output-options:
  # Required. The generator is handed a document with no operations (see
  # _prune), so pruning would strip every schema.
  skip-prune: true
  name-normalizer: ToCamelCaseWithInitialisms
